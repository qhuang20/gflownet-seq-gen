[project]
name = "gflownet-seq-gen-examples"
version = "0.2.0"
description = "Public examples for GFlowNet sequence generation"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch==2.10.0",
    "numpy>=2.2,<3",
    "matplotlib>=3.10,<4",
    "tqdm>=4.67,<5",
]

[dependency-groups]
notebook = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.4,<5",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
